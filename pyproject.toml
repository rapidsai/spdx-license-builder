[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spdx-license-builder"
dynamic = ["version"]
description = "Tools for extracting and managing license information from RAPIDS projects"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "NVIDIA CORPORATION & AFFILIATES"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["license", "spdx", "copyright", "license-management"]

# No external dependencies required - uses only Python standard library
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.14.0",
    "pre-commit>=3.0",
    "mypy>=1.0",
]

[project.scripts]
license-builder = "spdx_license_builder.cli:main"
license-builder-update-custom-licenses = "spdx_license_builder.update_custom_licenses:main"

[project.urls]
Homepage = "https://github.com/rapidsai/spdx-license-builder"
Documentation = "https://github.com/rapidsai/spdx-license-builder/blob/main/README.md"
Repository = "https://github.com/rapidsai/spdx-license-builder"
Issues = "https://github.com/rapidsai/spdx-license-builder/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["spdx_license_builder*"]

[tool.setuptools.package-data]
spdx_license_builder = [
    "common_licenses/*.txt",
    "custom_licenses/*.txt",
    "custom_licenses/*.json",
    "custom_licenses/*.md",
    "license_exceptions/*.txt",
    "license_exceptions/*.md",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (e.g., integration tests with network I/O)",
]
