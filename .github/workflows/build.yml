name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: |
        python -m build

    - name: Check dist files
      run: |
        ls -lh dist/

    - name: Upload artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: dist-packages
        path: dist/

    - name: Verify wheel contents
      run: |
        pip install check-wheel-contents
        check-wheel-contents dist/*.whl

  install-test:
    name: Test installation from wheel
    needs: build
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.13']

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: dist-packages
        path: dist/

    - name: Install from wheel
      shell: bash
      run: |
        pip install dist/*.whl

    - name: Test CLI commands
      run: |
        license-builder --version
        license-builder --help

    - name: Test Python import
      run: |
        python -c "from spdx_license_builder import __version__; print(f'Version: {__version__}')"
        python -c "from spdx_license_builder import get_project_relative_path, get_license_text"
